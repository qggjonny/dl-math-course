  <text x="418" y="332.0" fill="#999" font-size="13" font-family="serif" font-style="italic">x₂</text>

  <line x1="90" y1="440" x2="90" y2="34.0" stroke="#777" stroke-width="1.2"/>
  <polygon points="90,34.0 85,42.0 95,42.0" fill="#777"/>
