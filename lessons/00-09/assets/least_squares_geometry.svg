    <marker id="arrowGold" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#ffd700"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#1a1a2e" rx="12"/>

  <g stroke="#ffffff" stroke-width="0.3" stroke-dasharray="3,6" opacity="0.14">
    <line x1="150.0" y1="40.0" x2="150.0" y2="436"/>
