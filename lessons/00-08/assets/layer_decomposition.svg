<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" style="max-width:720px">
  <defs>
    <linearGradient id="gradA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="gradL1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="100%" stop-color="#f5576c"/>
    </linearGradient>
    <linearGradient id="gradL2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="340" fill="#1a1a2e" rx="12"/>

  <!-- Title -->
  <text x="360" y="35" text-anchor="middle" fill="#e0e0e0" font-size="18" font-family="sans-serif" font-weight="bold">SVD 图层分解：A = σ₁·u₁·v₁ᵀ + σ₂·u₂·v₂ᵀ</text>

  <!-- Row 1: Original A -->
  <text x="360" y="70" text-anchor="middle" fill="#aaa" font-size="13" font-family="sans-serif">原始矩阵 A</text>
  <rect x="270" y="82" width="60" height="50" rx="5" fill="url(#gradA)" opacity="0.9"/>
  <text x="300" y="102" text-anchor="middle" fill="white" font-size="18" font-family="monospace" font-weight="bold">3</text>
  <text x="300" y="122" text-anchor="middle" fill="white" font-size="14" font-family="monospace">1</text>
  <rect x="330" y="82" width="60" height="50" rx="5" fill="url(#gradA)" opacity="0.9"/>
  <text x="360" y="102" text-anchor="middle" fill="white" font-size="18" font-family="monospace" font-weight="bold">1</text>
  <text x="360" y="122" text-anchor="middle" fill="white" font-size="14" font-family="monospace">3</text>

  <!-- Row 2: σ₁ info -->
  <text x="100" y="175" text-anchor="middle" fill="#f5576c" font-size="14" font-family="sans-serif" font-weight="bold">σ₁ = 4</text>
  <text x="100" y="195" text-anchor="middle" fill="#888" font-size="11" font-family="sans-serif">第1层（主成分）</text>

  <!-- Row 2: Layer 1 -->
  <rect x="160" y="155" width="60" height="50" rx="5" fill="url(#gradL1)" opacity="0.9"/>
  <text x="190" y="175" text-anchor="middle" fill="white" font-size="18" font-family="monospace" font-weight="bold">2</text>
  <text x="190" y="195" text-anchor="middle" fill="white" font-size="14" font-family="monospace">2</text>
  <rect x="220" y="155" width="60" height="50" rx="5" fill="url(#gradL1)" opacity="0.9"/>
  <text x="250" y="175" text-anchor="middle" fill="white" font-size="18" font-family="monospace" font-weight="bold">2</text>
  <text x="250" y="195" text-anchor="middle" fill="white" font-size="14" font-family="monospace">2</text>

  <!-- Plus sign between layers -->
  <text x="330" y="185" text-anchor="middle" fill="#aaa" font-size="28" font-family="sans-serif">+</text>

  <!-- Row 2: σ₂ info -->
  <text x="520" y="175" text-anchor="middle" fill="#4facfe" font-size="14" font-family="sans-serif" font-weight="bold">σ₂ = 2</text>
  <text x="520" y="195" text-anchor="middle" fill="#888" font-size="11" font-family="sans-serif">第2层（细节）</text>

  <!-- Row 2: Layer 2 -->
  <rect x="400" y="155" width="60" height="50" rx="5" fill="url(#gradL2)" opacity="0.9"/>
  <text x="430" y="175" text-anchor="middle" fill="white" font-size="18" font-family="monospace" font-weight="bold">1</text>
  <text x="430" y="195" text-anchor="middle" fill="white" font-size="14" font-family="monospace">-1</text>
  <rect x="460" y="155" width="60" height="50" rx="5" fill="url(#gradL2)" opacity="0.9"/>
  <text x="490" y="175" text-anchor="middle" fill="white" font-size="18" font-family="monospace" font-weight="bold">-1</text>
  <text x="490" y="195" text-anchor="middle" fill="white" font-size="14" font-family="monospace">1</text>

  <!-- Row 3: u,v info -->
  <text x="100" y="245" text-anchor="middle" fill="#888" font-size="10" font-family="monospace">u₁=[-0.707,-0.707]ᵀ</text>
  <text x="100" y="260" text-anchor="middle" fill="#888" font-size="10" font-family="monospace">v₁=[-0.707,-0.707]</text>
  <text x="520" y="245" text-anchor="middle" fill="#888" font-size="10" font-family="monospace">u₂=[-0.707, 0.707]ᵀ</text>
  <text x="520" y="260" text-anchor="middle" fill="#888" font-size="10" font-family="monospace">v₂=[-0.707, 0.707]</text>

  <!-- Down arrow from A to layers -->
  <line x1="300" y1="135" x2="250" y2="152" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="135" x2="400" y2="152" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#888"/>
    </marker>
  </defs>

  <!-- Bottom label -->
  <text x="360" y="310" text-anchor="middle" fill="#ccc" font-size="13" font-family="sans-serif">每一层是一个秩1矩阵（外积 σᵢ·uᵢ·vᵢᵀ），σ 越大贡献越大</text>

  <!-- Rank badges -->
  <text x="190" y="225" text-anchor="middle" fill="#f5576c" font-size="10" font-family="sans-serif">秩 = 1</text>
  <text x="430" y="225" text-anchor="middle" fill="#4facfe" font-size="10" font-family="sans-serif">秩 = 1</text>
</svg>