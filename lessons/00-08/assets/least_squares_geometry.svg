<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%" style="max-width:640px">
  <defs>
    <linearGradient id="planeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#764ba2" stop-opacity="0.10"/>
    </linearGradient>
    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#aaa"/>
    </marker>
    <marker id="arrowHeadRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#f5576c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="640" height="380" fill="#1a1a2e" rx="12"/>

  <!-- Axes -->
  <line x1="80" y1="310" x2="580" y2="310" stroke="#444" stroke-width="1"/>
  <line x1="80" y1="310" x2="80" y2="40" stroke="#444" stroke-width="1"/>
  <text x="590" y="315" fill="#666" font-size="11" font-family="sans-serif">x₁</text>
  <text x="72" y="35" fill="#666" font-size="11" font-family="sans-serif">x₂</text>

  <!-- Column space plane -->
  <polygon points="80,310 460,310 560,160 180,160" fill="url(#planeGrad)" stroke="#667eea" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="80" y1="310" x2="305" y2="235" stroke="#667eea" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>
  <line x1="180" y1="160" x2="560" y2="160" stroke="#667eea" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>
  <line x1="460" y1="310" x2="305" y2="235" stroke="#667eea" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>

  <text x="560" y="145" fill="#667eea" font-size="13" font-family="sans-serif" font-weight="bold">列空间 Col(A)</text>
  <text x="560" y="163" fill="#667eea" font-size="10" font-family="sans-serif" opacity="0.7">（所有 Ax 的集合）</text>

  <!-- A vector: draw LONG, extending well past the projection point -->
  <!-- Ax: origin (80,310) → tip (480,110). Direction: (400, -200) = (2, -1) -->
  <!-- The perpendicular foot (投影/垂足) is at (320, 190) — on the line but NOT at the tip -->
  <!-- Check: (320-80, 190-310) = (240, -120) = 0.6 × (400, -200) — yes, on the line -->
  <line x1="80" y1="310" x2="480" y2="110" stroke="#4facfe" stroke-width="3" marker-end="url(#arrowHead)"/>
  <text x="488" y="118" fill="#4facfe" font-size="14" font-family="serif" font-weight="bold" font-style="italic">A<b>x</b></text>

  <!-- Projection point (垂足) on the Ax line — NOT at the tip -->
  <circle cx="320" cy="190" r="4.5" fill="#4facfe" stroke="#fff" stroke-width="1"/>

  <!-- b vector: from origin to a point directly above the projection point -->
  <line x1="80" y1="310" x2="320" y2="70" stroke="#f5576c" stroke-width="2.5" marker-end="url(#arrowHeadRed)"/>
  <text x="328" y="65" fill="#f5576c" font-size="14" font-family="serif" font-weight="bold" font-style="italic">b</text>

  <!-- Residual r: perpendicular drop from b tip to the projection point on Ax -->
  <line x1="320" y1="190" x2="320" y2="70" stroke="#ffd700" stroke-width="2.5" stroke-dasharray="8,5"/>
  <text x="330" y="135" fill="#ffd700" font-size="12" font-family="serif" font-weight="bold" font-style="italic">r = b − A<b>x</b></text>

  <!-- RIGHT ANGLE MARKER — properly constructed -->
  <!-- Intersection P = (320, 190) -->
  <!-- Ax direction at P: (2, -1). Unit step ≈ 16px along Ax: (dx, dy) ≈ (14.3, -7.2) ≈ (14, -7) -->
  <!-- So Q = P + (14, -7) = (334, 183) — point along Ax near P -->
  <!-- r direction: pure vertical up. Unit step 16px: (0, -16) -->
  <!-- So R = P + (0, -16) = (320, 174) — point along r near P -->
  <!-- Draw: Q → P → R  (the ⊓ shape) -->
  <polyline points="334,183 320,190 320,174" fill="none" stroke="#ffd700" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Origin -->
  <circle cx="80" cy="310" r="3" fill="#aaa"/>
  <text x="60" y="328" fill="#aaa" font-size="11" font-family="serif">O</text>

  <!-- Legend -->
  <rect x="20" y="20" width="220" height="95" rx="6" fill="#ffffff08" stroke="#333" stroke-width="1"/>
  <text x="34" y="42" fill="#ccc" font-size="12" font-family="sans-serif" font-weight="bold">最小二乘的几何意义</text>
  <line x1="30" y1="58" x2="55" y2="58" stroke="#f5576c" stroke-width="2.5"/>
  <text x="62" y="62" fill="#aaa" font-size="11" font-family="sans-serif">b — 目标向量（在列空间外）</text>
  <line x1="30" y1="76" x2="55" y2="76" stroke="#4facfe" stroke-width="2.5"/>
  <text x="62" y="80" fill="#aaa" font-size="11" font-family="sans-serif">Ax — 列空间里离 b 最近的点</text>
  <line x1="30" y1="94" x2="55" y2="94" stroke="#ffd700" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="62" y="98" fill="#aaa" font-size="11" font-family="sans-serif">r = b−Ax — 残差（垂直于平面）</text>
</svg>
